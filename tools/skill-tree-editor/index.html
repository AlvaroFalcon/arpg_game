<style id="page-style">
/* Layout: a smith's bench — skills on a rack (left), the tree on the anvil (centre), the node in hand (right). */
:root {
  --bg: #f3efe8; --panel: #fbf8f2; --ink: #2a2230; --muted: #6f6574; --line: #d9d0c4;
  --ember: #c4501f; --ember-soft: #f6dccd; --steel: #3d5d8a; --steel-soft: #dce5f2;
  --gold: #a87a1c; --new: #2f7d4f; --new-soft: #d8eedf; --cut: #a8323a; --cut-soft: #f5d9db;
  --notable-bg: #fff4e0;
  --display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17141c; --panel: #201b27; --ink: #ece4d8; --muted: #a59aa8; --line: #3a3244;
  --ember: #f07a42; --ember-soft: #43271c; --steel: #8fb0e0; --steel-soft: #1f2a3c;
  --gold: #e0b450; --new: #6fd197; --new-soft: #1c3527; --cut: #f0737b; --cut-soft: #3e1d22;
  --notable-bg: #33281a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #17141c; --panel: #201b27; --ink: #ece4d8; --muted: #a59aa8; --line: #3a3244;
  --ember: #f07a42; --ember-soft: #43271c; --steel: #8fb0e0; --steel-soft: #1f2a3c;
  --gold: #e0b450; --new: #6fd197; --new-soft: #1c3527; --cut: #f0737b; --cut-soft: #3e1d22;
  --notable-bg: #33281a; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 32px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
header.top h1 { font: 700 26px/1.1 var(--display); margin: 0; letter-spacing: .02em; color: var(--ember); text-wrap: balance; }
header.top .sub { color: var(--muted); font-size: 13px; }
header.top .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
button, .btn { font: 600 13px var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 11px; border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--ember); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .node:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
button.primary { background: var(--ember); border-color: var(--ember); color: #fff; }
button.danger { color: var(--cut); }
button[disabled] { opacity: .5; cursor: default; }
.status { font-size: 12px; color: var(--muted); min-height: 1.4em; }
.grid { display: grid; grid-template-columns: 230px minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .grid { grid-template-columns: 200px minmax(0, 1fr); } .inspector { grid-column: 1 / -1; } }
@media (max-width: 700px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.rack h2, .inspector h2, .bench h2 { font: 700 15px var(--display); letter-spacing: .04em; margin: 0 0 8px; color: var(--muted); }
.rack input[type=search] { width: 100%; margin-bottom: 8px; }
.skill-list { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow: auto; }
.skill-list li button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 6px; border: 0; border-radius: 5px; padding: 6px 8px; background: transparent; font-weight: 500; }
.skill-list li button[aria-current="true"] { background: var(--ember-soft); color: var(--ink); }
.skill-list .type { font: 400 11px var(--mono); color: var(--muted); }
.chip { display: inline-block; font: 600 10px/1 var(--mono); padding: 3px 5px; border-radius: 4px; letter-spacing: .04em; text-transform: uppercase; }
.chip.new { background: var(--new-soft); color: var(--new); }
.chip.changed { background: var(--steel-soft); color: var(--steel); }
.chip.removed { background: var(--cut-soft); color: var(--cut); }
label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
input, select, textarea { font: 14px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 54px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 8px; }
.fields .wide { grid-column: 1 / -1; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bench-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 10px; }
.bench-head h2 { font: 700 24px var(--display); color: var(--ink); margin: 0; }
.bench-head .meta { font: 12px var(--mono); color: var(--muted); }
details.skill-fields { margin-bottom: 12px; }
details.skill-fields summary { cursor: pointer; font-weight: 600; color: var(--steel); margin-bottom: 8px; }
.tree-scroll { overflow-x: auto; padding-bottom: 6px; }
.tree { position: relative; display: grid; gap: 14px; min-width: 640px; padding-top: 10px; }
.tree svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.branch { display: grid; grid-template-columns: 130px repeat(var(--cols), minmax(150px, 1fr)) 56px; gap: 14px; align-items: center; position: relative; }
.branch-name input { font: 700 15px var(--display); background: transparent; border-color: transparent; padding: 4px; }
.branch-name input:hover, .branch-name input:focus { border-color: var(--line); }
.branch-name .hint { font: 11px var(--mono); color: var(--muted); padding-left: 5px; }
.cell { display: grid; gap: 8px; align-content: center; min-height: 72px; position: relative; }
.cell.either { border: 1px dashed var(--gold); border-radius: 8px; padding: 18px 6px 6px; }
.cell.either::before { content: "elige una"; position: absolute; top: 2px; left: 8px; font: 600 10px var(--mono); color: var(--gold); text-transform: uppercase; letter-spacing: .06em; }
.node { position: relative; z-index: 1; text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 9px; display: grid; gap: 2px; cursor: pointer; width: 100%; font-weight: 400; }
.node.notable { background: var(--notable-bg); border-color: var(--gold); border-radius: 18px; }
.node[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ember-soft); border-color: var(--ember); }
.node .n-name { font-weight: 600; font-size: 14px; }
.node .n-rank { font-size: 12px; color: var(--muted); }
.node .n-meta { font: 10px var(--mono); color: var(--muted); }
.node.st-new { border-color: var(--new); }
.node.st-changed { border-color: var(--steel); }
.node.st-removed { border-color: var(--cut); opacity: .55; text-decoration: line-through; }
.node .chip { position: absolute; top: -8px; right: 8px; }
.add-node { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; padding: 0; color: var(--ember); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 18px; height: 12px; border: 1.5px solid var(--line); border-radius: 3px; background: var(--panel); }
.swatch.notable { border-color: var(--gold); border-radius: 8px; background: var(--notable-bg); }
.inspector .empty { color: var(--muted); font-size: 13px; }
.ranks { display: grid; gap: 6px; }
.rank-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 30px; gap: 6px; align-items: center; }
.rank-row .r { font: 600 12px var(--mono); color: var(--muted); text-align: right; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.changes { margin-top: 18px; }
.changes h2 { font: 700 18px var(--display); margin: 0 0 8px; }
.changes ol { margin: 0; padding-left: 20px; font-size: 13px; display: grid; gap: 3px; }
.changes .none { color: var(--muted); font-size: 13px; }
.changes pre { white-space: pre-wrap; font: 12px/1.5 var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 280px; overflow: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: no-preference) { .node { transition: box-shadow .15s, border-color .15s; } }
</style>

% more mana cost"],"requires":"haste","requiresRanks":2,"note":""}],"tags":"Attack, Area","type":"Affliction","unlock":10,"useTime":0.449999988079071,"note":""}]}</script>
<script id="app-src">
(function () {
  "use strict";
  const SHELL = `<div class="wrap" id="app">
  <header class="top">
    <h1>Escaldón's Workbench</h1>
    <span class="sub">Árboles de mejora de cada habilidad: añade, quita o edita nodos y guarda.</span>
    <div class="actions">
      <button id="btn-save" class="primary" type="button">Guardar</button>
      <button id="btn-copy" type="button">Copiar cambios</button>
      <button id="btn-export" type="button">Exportar JSON</button>
      <label class="btn" for="file-import" style="display:inline-block">Importar JSON<input id="file-import" type="file" accept="application/json,.json" class="sr"></label>
      <button id="btn-reset" class="danger" type="button">Deshacer todo</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </header>

  <div class="grid">
    <nav class="panel rack" aria-label="Habilidades">
      <h2>Habilidades</h2>
      <input id="search" type="search" placeholder="Buscar…" aria-label="Buscar habilidad">
      <ul class="skill-list" id="skill-list"></ul>
      <div class="row"><button id="btn-new-skill" type="button">+ Habilidad nueva</button></div>
    </nav>

    <main class="panel bench" id="bench"></main>

    <aside class="panel inspector" id="inspector" aria-label="Nodo seleccionado"></aside>
  </div>

  <section class="changes" id="changes"></section>
</div>`;
  document.getElementById("root").innerHTML = SHELL;
  const STORE_KEY = "escaldon-workbench-draft-v1";
  const raw = JSON.parse(document.getElementById("tree-data").textContent);
  // base = what the game has (from DumpSkillTrees); skills = the edited copy.
  const state = {
    base: raw.base || raw.skills.map(s => JSON.parse(JSON.stringify(s))),
    skills: raw.edited || raw.skills,
    savedAt: raw.savedAt || null,
    note: raw.note || "",
  };
  let current = state.skills[0] ? state.skills[0].id : null;
  let selected = null;
  let dirty = false;

  try {
    const draft = localStorage.getItem(STORE_KEY);
    if (draft) {
      const d = JSON.parse(draft);
      if (d && d.savedAt === state.savedAt && Array.isArray(d.skills)) { state.skills = d.skills; state.note = d.note || ""; dirty = true; }
    }
  } catch (e) { /* storage unavailable: work in memory */ }

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const skill = id => state.skills.find(s => s.id === id);
  const baseSkill = id => state.base.find(s => s.id === id);
  const baseNode = (sid, nid) => (baseSkill(sid)?.nodes || []).find(n => n.id === nid);
  const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "node";

  function nodeStatus(sid, n) {
    if (n.removed) return "removed";
    const b = baseNode(sid, n.id);
    if (!b) return "new";
    const keys = ["name", "kind", "branch", "depth", "requires", "requiresRanks", "exclusive", "note"];
    if (keys.some(k => (b[k] ?? "") !== (n[k] ?? "")) || JSON.stringify(b.ranks) !== JSON.stringify(n.ranks)) return "changed";
    return "";
  }
  function skillStatus(s) {
    const b = baseSkill(s.id);
    if (!b) return "new";
    const keys = ["name", "unlock", "damage", "useTime", "cooldown", "mana", "description", "note"];
    if (keys.some(k => (b[k] ?? "") !== (s[k] ?? "")) || JSON.stringify(b.branches) !== JSON.stringify(s.branches)) return "changed";
    if (s.nodes.some(n => nodeStatus(s.id, n)) || b.nodes.length !== s.nodes.length) return "changed";
    return "";
  }

  function touch() {
    dirty = true;
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ savedAt: state.savedAt, skills: state.skills, note: state.note })); } catch (e) { /* ignore */ }
    renderList(); renderChanges();
    setStatus("Cambios sin guardar.");
  }
  function setStatus(t) { $("status").textContent = t; }

  // --- the rack ---------------------------------------------------------------
  function renderList() {
    const q = $("search").value.trim().toLowerCase();
    const ul = $("skill-list");
    ul.innerHTML = "";
    for (const s of state.skills) {
      if (q && !(s.name + " " + s.id + " " + s.type).toLowerCase().includes(q)) continue;
      const st = skillStatus(s);
      const li = document.createElement("li");
      li.innerHTML = `<button type="button" aria-current="${s.id === current}"><span>${esc(s.name)}<br><span class="type">${esc(s.type)} · nv ${esc(s.unlock)}</span></span>${st ? `<span class="chip ${st}">${st === "new" ? "nueva" : "cambios"}</span>` : ""}</button>`;
      li.firstChild.addEventListener("click", () => { current = s.id; selected = null; renderAll(); });
      ul.appendChild(li);
    }
  }

  // --- the bench ----------------------------------------------------------------
  function renderBench() {
    const s = skill(current);
    const bench = $("bench");
    if (!s) { bench.innerHTML = `<p class="empty">Elige una habilidad.</p>`; return; }
    const cols = Math.max(3, ...s.nodes.map(n => n.depth + 1));
    const points = s.nodes.filter(n => !n.removed && !n.exclusive).reduce((a, n) => a + n.ranks.length, 0)
      + new Set(s.nodes.filter(n => !n.removed && n.exclusive).map(n => n.exclusive)).size;
    bench.innerHTML = `
      <div class="bench-head"><h2>${esc(s.name)}</h2><span class="meta">${esc(s.id)} · ${esc(s.type)} · ${esc(s.tags)}</span>
        <span class="meta num">${points} rangos en el árbol · una gema de nivel 20 tiene 19 puntos</span></div>
      <details class="skill-fields" ${skillStatus(s) === "new" ? "open" : ""}><summary>Datos de la habilidad</summary>
        <div class="fields">
          <label>Nombre<input id="f-name" value="${esc(s.name)}"></label>
          <label>Nivel para comprarla<input id="f-unlock" class="num" type="number" min="1" value="${esc(s.unlock)}"></label>
          <label>Daño base<input id="f-damage" class="num" type="number" step="any" value="${esc(s.damage)}"></label>
          <label>Tiempo de uso (s)<input id="f-useTime" class="num" type="number" step="any" value="${esc(s.useTime)}"></label>
          <label>Cooldown (s)<input id="f-cooldown" class="num" type="number" step="any" value="${esc(s.cooldown)}"></label>
          <label>Maná (nivel 1)<input id="f-mana" class="num" type="number" step="any" value="${esc(s.mana)}"></label>
          <label class="wide">Descripción<textarea id="f-description">${esc(s.description)}</textarea></label>
          <label class="wide">Notas para Claude<textarea id="f-note" placeholder="Qué quieres cambiar y por qué">${esc(s.note || "")}</textarea></label>
        </div>
      </details>
      <div class="tree-scroll"><div class="tree" id="tree"><svg class="links" id="links" aria-hidden="true"></svg></div></div>
      <div class="legend"><span><i class="swatch"></i>Menor (varios rangos)</span><span><i class="swatch notable"></i>Notable (1 rango)</span>
        <span>Línea: requiere puntos en el nodo anterior</span><span>Recuadro dorado: elige uno de los dos</span></div>`;
    for (const k of ["name", "unlock", "damage", "useTime", "cooldown", "mana", "description", "note"]) {
      const el = $("f-" + k);
      el.addEventListener("change", () => {
        s[k] = el.type === "number" ? Number(el.value) : el.value;
        touch(); if (k === "name") renderBench();
      });
    }

    const tree = $("tree");
    const branches = s.branches.length ? s.branches : ["Rama 1", "Rama 2", "Rama 3"];
    s.branches = branches;
    branches.forEach((bname, bi) => {
      const row = document.createElement("div");
      row.className = "branch";
      row.style.setProperty("--cols", cols);
      const name = document.createElement("div");
      name.className = "branch-name";
      name.innerHTML = `<input aria-label="Nombre de la rama ${bi + 1}" value="${esc(bname)}"><div class="hint">rama ${bi + 1}</div>`;
      name.querySelector("input").addEventListener("change", e => { s.branches[bi] = e.target.value; touch(); });
      row.appendChild(name);
      for (let d = 0; d < cols; d++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const here = s.nodes.filter(n => n.branch === bi && n.depth === d);
        if (here.length > 1 && here.every(n => n.exclusive && n.exclusive === here[0].exclusive)) cell.classList.add("either");
        for (const n of here) cell.appendChild(nodeCard(s, n));
        row.appendChild(cell);
      }
      const add = document.createElement("button");
      add.type = "button"; add.className = "add-node"; add.title = "Añadir un nodo al final de esta rama"; add.setAttribute("aria-label", `Añadir nodo a ${bname}`);
      add.textContent = "+";
      add.addEventListener("click", () => addNode(s, bi));
      row.appendChild(add);
      tree.appendChild(row);
    });
    requestAnimationFrame(() => drawLinks(s));
  }

  function nodeCard(s, n) {
    const st = nodeStatus(s.id, n);
    const b = document.createElement("button");
    b.type = "button";
    b.className = `node ${n.kind === "Notable" ? "notable" : ""} ${st ? "st-" + st : ""}`;
    b.dataset.id = n.id;
    b.setAttribute("aria-pressed", String(selected === n.id));
    const ranks = n.ranks.length > 1 ? `${n.ranks.length} rangos · ${esc(n.ranks[0])} → ${esc(n.ranks[n.ranks.length - 1])}` : esc(n.ranks[0] || "—");
    const req = n.requires ? `necesita ${n.requiresRanks || 1} en ${esc((s.nodes.find(x => x.id === n.requires) || {}).name || n.requires)}` : "inicio de rama";
    b.innerHTML = `${st ? `<span class="chip ${st}">${st === "new" ? "nuevo" : st === "removed" ? "quitar" : "cambio"}</span>` : ""}
      <span class="n-name">${esc(n.name)}</span><span class="n-rank">${ranks}</span><span class="n-meta">${req}</span>`;
    b.addEventListener("click", () => { selected = n.id; renderBench(); renderInspector(); });
    return b;
  }

  function drawLinks(s) {
    const tree = $("tree"), svg = $("links");
    if (!tree || !svg) return;
    const box = tree.getBoundingClientRect();
    const css = getComputedStyle(document.documentElement);
    let html = "";
    for (const n of s.nodes) {
      if (!n.requires) continue;
      const a = tree.querySelector(`.node[data-id="${CSS.escape(n.requires)}"]`);
      const b = tree.querySelector(`.node[data-id="${CSS.escape(n.id)}"]`);
      if (!a || !b) continue;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const x1 = ra.right - box.left, y1 = ra.top + ra.height / 2 - box.top;
      const x2 = rb.left - box.left, y2 = rb.top + rb.height / 2 - box.top;
      const mx = (x1 + x2) / 2;
      const colour = n.removed ? css.getPropertyValue("--cut") : css.getPropertyValue("--muted");
      html += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${colour.trim()}" stroke-width="1.6" ${n.removed ? 'stroke-dasharray="4 3"' : ""}/>`;
      html += `<text x="${mx}" y="${(y1 + y2) / 2 - 4}" font-size="10" font-family="IBM Plex Mono, monospace" fill="${css.getPropertyValue("--muted").trim()}" text-anchor="middle">${n.requiresRanks || 1}</text>`;
    }
    svg.innerHTML = html;
  }

  function addNode(s, bi) {
    const inBranch = s.nodes.filter(n => n.branch === bi && !n.removed);
    const depth = inBranch.length ? Math.max(...inBranch.map(n => n.depth)) + 1 : 0;
    const parent = inBranch.filter(n => n.depth === depth - 1)[0];
    let id = "new_node", i = 1;
    while (s.nodes.some(n => n.id === id)) id = "new_node_" + (++i);
    const n = { id, name: "Nodo nuevo", kind: depth >= 2 ? "Notable" : "Lesser", branch: bi, depth,
      ranks: depth >= 2 ? ["Qué hace"] : ["Rango 1", "Rango 2", "Rango 3"], requires: parent ? parent.id : "", requiresRanks: parent ? 2 : 0, exclusive: "", note: "" };
    s.nodes.push(n);
    selected = n.id;
    touch(); renderBench(); renderInspector();
  }

  // --- the inspector --------------------------------------------------------------
  function renderInspector() {
    const box = $("inspector");
    const s = skill(current);
    const n = s && s.nodes.find(x => x.id === selected);
    if (!n) {
      box.innerHTML = `<h2>Nodo</h2><p class="empty">Pulsa un nodo del árbol para editarlo, o + al final de una rama para añadir uno.</p>`;
      return;
    }
    const others = s.nodes.filter(x => x.id !== n.id && !x.removed);
    const label = { new: "nuevo", changed: "cambio", removed: "quitar" }[nodeStatus(s.id, n)] || "";
    box.innerHTML = `<h2>Nodo ${label ? `<span class="chip ${nodeStatus(s.id, n)}">${label}</span>` : ""}</h2>
      <div class="fields">
        <label class="wide">Nombre<input id="n-name" value="${esc(n.name)}"></label>
        <label>Tipo<select id="n-kind"><option value="Lesser">Menor</option><option value="Notable">Notable</option></select></label>
        <label>Rama<select id="n-branch">${s.branches.map((b, i) => `<option value="${i}">${esc(b)}</option>`).join("")}</select></label>
        <label>Columna<input id="n-depth" class="num" type="number" min="0" max="6" value="${n.depth}"></label>
        <label>Puntos necesarios<input id="n-reqranks" class="num" type="number" min="0" max="5" value="${n.requiresRanks || 0}"></label>
        <label class="wide">Requiere<select id="n-requires"><option value="">— nada (inicio de rama) —</option>${others.map(o => `<option value="${esc(o.id)}">${esc(o.name)} (${esc(o.id)})</option>`).join("")}</select></label>
        <label class="wide">Grupo "elige uno" (mismo texto en los nodos que se excluyen)<input id="n-exclusive" value="${esc(n.exclusive)}" placeholder="vacío = no excluye"></label>
      </div>
      <label>Qué hace cada rango</label>
      <div class="ranks" id="n-ranks">${n.ranks.map((r, i) => `<div class="rank-row"><span class="r">${i + 1}</span><input data-rank="${i}" value="${esc(r)}" aria-label="Rango ${i + 1}"><button type="button" data-del="${i}" aria-label="Quitar rango ${i + 1}" ${n.ranks.length < 2 ? "disabled" : ""}>×</button></div>`).join("")}</div>
      <div class="row"><button id="n-addrank" type="button">+ Rango</button></div>
      <label style="margin-top:10px">Notas para Claude<textarea id="n-note" placeholder="Idea, valores, por qué">${esc(n.note || "")}</textarea></label>
      <p class="n-meta" style="font:11px var(--mono);color:var(--muted)">id: ${esc(n.id)}</p>
      <div class="row">${n.removed ? `<button id="n-restore" type="button">Recuperar nodo</button>` : `<button id="n-delete" class="danger" type="button">Quitar nodo</button>`}</div>`;
    $("n-kind").value = n.kind;
    $("n-branch").value = String(n.branch);
    $("n-requires").value = n.requires || "";
    const set = (k, v) => { n[k] = v; touch(); renderBench(); renderInspector(); };
    $("n-name").addEventListener("change", e => { const was = baseNode(s.id, n.id); n.name = e.target.value; if (!was && n.id.startsWith("new_node")) { let id = slug(n.name); while (s.nodes.some(x => x !== n && x.id === id)) id += "_2"; s.nodes.forEach(x => { if (x.requires === n.id) x.requires = id; }); n.id = id; selected = id; } touch(); renderBench(); renderInspector(); });
    $("n-kind").addEventListener("change", e => set("kind", e.target.value));
    $("n-branch").addEventListener("change", e => set("branch", Number(e.target.value)));
    $("n-depth").addEventListener("change", e => set("depth", Math.max(0, Number(e.target.value))));
    $("n-reqranks").addEventListener("change", e => set("requiresRanks", Math.max(0, Number(e.target.value))));
    $("n-requires").addEventListener("change", e => set("requires", e.target.value));
    $("n-exclusive").addEventListener("change", e => set("exclusive", e.target.value.trim()));
    $("n-note").addEventListener("change", e => { n.note = e.target.value; touch(); });
    box.querySelectorAll("input[data-rank]").forEach(el => el.addEventListener("change", e => { n.ranks[Number(e.target.dataset.rank)] = e.target.value; touch(); renderBench(); }));
    box.querySelectorAll("button[data-del]").forEach(el => el.addEventListener("click", e => { n.ranks.splice(Number(e.currentTarget.dataset.del), 1); set("ranks", n.ranks); }));
    $("n-addrank").addEventListener("click", () => { n.ranks.push(""); set("ranks", n.ranks); });
    const del = $("n-delete");
    if (del) del.addEventListener("click", () => {
      if (!baseNode(s.id, n.id)) { s.nodes = s.nodes.filter(x => x !== n); s.nodes.forEach(x => { if (x.requires === n.id) x.requires = ""; }); selected = null; touch(); renderBench(); renderInspector(); }
      else set("removed", true);
    });
    const restore = $("n-restore");
    if (restore) restore.addEventListener("click", () => { delete n.removed; touch(); renderBench(); renderInspector(); });
  }

  // --- the change list ---------------------------------------------------------
  function changeLines() {
    const out = [];
    for (const s of state.skills) {
      const b = baseSkill(s.id);
      if (!b) { out.push(`NUEVA HABILIDAD ${s.name} (${s.id}): ${s.type}, nv ${s.unlock}, daño ${s.damage}, uso ${s.useTime}s, cd ${s.cooldown}s, maná ${s.mana}. ${s.description}${s.note ? " — Nota: " + s.note : ""}`); }
      else {
        for (const k of ["name", "unlock", "damage", "useTime", "cooldown", "mana", "description"]) if ((b[k] ?? "") !== (s[k] ?? "")) out.push(`${s.name}: ${k} ${JSON.stringify(b[k])} → ${JSON.stringify(s[k])}`);
        if (JSON.stringify(b.branches) !== JSON.stringify(s.branches)) out.push(`${s.name}: ramas ${b.branches.join(" / ")} → ${s.branches.join(" / ")}`);
        if (s.note && s.note !== (b.note || "")) out.push(`${s.name}: nota — ${s.note}`);
      }
      for (const n of s.nodes) {
        const st = nodeStatus(s.id, n);
        const where = `${s.name} / ${s.branches[n.branch] || "rama " + (n.branch + 1)} / ${n.name}`;
        if (st === "new") out.push(`${where}: NODO NUEVO (${n.kind === "Notable" ? "notable" : "menor"}, columna ${n.depth + 1}${n.requires ? `, requiere ${n.requiresRanks} en ${n.requires}` : ""}${n.exclusive ? `, elige-uno "${n.exclusive}"` : ""}): ${n.ranks.join(" | ")}${n.note ? " — Nota: " + n.note : ""}`);
        else if (st === "removed") out.push(`${where}: QUITAR NODO (${n.id})${n.note ? " — Nota: " + n.note : ""}`);
        else if (st === "changed") {
          const o = baseNode(s.id, n.id), diffs = [];
          for (const k of ["name", "kind", "branch", "depth", "requires", "requiresRanks", "exclusive"]) if ((o[k] ?? "") !== (n[k] ?? "")) diffs.push(`${k} ${JSON.stringify(o[k])} → ${JSON.stringify(n[k])}`);
          if (JSON.stringify(o.ranks) !== JSON.stringify(n.ranks)) diffs.push(`rangos ${o.ranks.join(" | ")} → ${n.ranks.join(" | ")}`);
          if (n.note && n.note !== (o.note || "")) diffs.push(`nota — ${n.note}`);
          out.push(`${where} (${n.id}): ${diffs.join("; ")}`);
        }
      }
    }
    return out;
  }
  function renderChanges() {
    const lines = changeLines();
    $("changes").innerHTML = `<h2>Cambios respecto al juego</h2>
      <label>Nota general<textarea id="g-note" placeholder="Cualquier cosa que quieras decirme sobre esta tanda de cambios">${esc(state.note)}</textarea></label>
      ${lines.length ? `<ol>${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ol>` : `<p class="none">Aún no hay cambios. Lo que edites aparecerá aquí, listo para copiar.</p>`}`;
    $("g-note").addEventListener("change", e => { state.note = e.target.value; touch(); });
  }

  // --- saving -------------------------------------------------------------------
  function payload(savedAt) {
    return { savedAt, note: state.note, base: state.base, edited: state.skills, skills: state.skills };
  }
  function documentFor(data) {
    const json = JSON.stringify(data).replace(/</g, "\\u003c");
    const style = document.getElementById("page-style").outerHTML;
    const app = document.getElementById("app-src").textContent;
    const head = Array.from(document.querySelectorAll("title, meta[name='claude:viewport-fit-sides'], link[href*='fonts']")).map(e => e.outerHTML).join("\n");
    const close = "</" + "script>";
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + RESET + "</style></head><body>"
      + head + "\n" + style + "\n<div id=\"root\"></div>\n<script type=\"application/json\" id=\"tree-data\">" + json + close
      + "\n<script id=\"app-src\">" + app + close + "\n</body></html>";
  }
  const RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";

  let artifact = null;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(a => { artifact = a; }).catch(() => { artifact = null; });
  }

  async function save() {
    const when = new Date().toISOString();
    if (artifact) {
      $("btn-save").disabled = true;
      setStatus("Guardando…");
      try {
        await artifact.publish(documentFor(payload(when)));
        try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
        setStatus("Guardado. Claude puede leer esta versión.");
      } catch (e) {
        const code = e && e.code;
        setStatus(code === "conflict" ? "Otra persona guardó a la vez; la página se recarga con su versión." : code === "not_granted" || code === "not_writer" ? "Solo lectura: exporta el JSON y pásaselo a Claude." : "No se pudo guardar: " + (e && e.message || e));
      } finally { $("btn-save").disabled = false; }
      return;
    }
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ savedAt: state.savedAt, skills: state.skills, note: state.note })); } catch (e) { /* ignore */ }
    setStatus("Guardado en este navegador. Para pasárselo a Claude: Exportar JSON y adjúntalo en el chat (o Copiar cambios).");
  }

  async function copyChanges() {
    const text = (state.note ? "Nota: " + state.note + "\n" : "") + changeLines().map((l, i) => `${i + 1}. ${l}`).join("\n");
    try { await navigator.clipboard.writeText(text || "Sin cambios"); setStatus("Cambios copiados: pégalos en el chat."); }
    catch (e) {
      $("changes").insertAdjacentHTML("beforeend", `<pre id="copy-fallback">${esc(text)}</pre>`);
      const r = document.createRange(); r.selectNodeContents($("copy-fallback")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      setStatus("No pude copiar solo: el texto está seleccionado abajo, cópialo con Ctrl+C.");
    }
  }

  async function exportJson() {
    const text = JSON.stringify(payload(new Date().toISOString()), null, 2);
    if (window.claude && typeof window.claude.use === "function") {
      const downloads = await window.claude.use("downloads").catch(() => null);
      if (downloads) {
        try { await downloads.save({ filename: "skill-trees-edited.json", data: text }); setStatus("JSON exportado."); return; } catch (e) { /* fall through */ }
      }
    }
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      a.download = "skill-trees-edited.json"; a.click();
      setStatus("JSON exportado.");
    } catch (e) { setStatus("No se pudo exportar: usa Copiar cambios."); }
  }

  $("file-import").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      const list = d.edited || d.skills;
      if (!Array.isArray(list)) throw new Error("no trae 'skills'");
      state.skills = list; state.note = d.note || state.note;
      if (Array.isArray(d.base) && !raw.base) state.base = d.base;
      current = state.skills[0] && state.skills[0].id; selected = null;
      touch(); renderAll(); setStatus("Importado " + f.name + ".");
    } catch (err) { setStatus("Ese archivo no es un JSON del banco de trabajo: " + err.message); }
  });
  $("btn-save").addEventListener("click", save);
  $("btn-copy").addEventListener("click", copyChanges);
  $("btn-export").addEventListener("click", exportJson);
  let resetArmed = false;
  $("btn-reset").addEventListener("click", e => {
    if (!resetArmed) { resetArmed = true; e.currentTarget.textContent = "¿Seguro? Pulsa otra vez"; setTimeout(() => { resetArmed = false; $("btn-reset").textContent = "Deshacer todo"; }, 4000); return; }
    state.skills = JSON.parse(JSON.stringify(state.base)); state.note = ""; selected = null; resetArmed = false;
    $("btn-reset").textContent = "Deshacer todo";
    try { localStorage.removeItem(STORE_KEY); } catch (err) { /* ignore */ }
    renderAll(); setStatus("Vuelto a lo que tiene el juego.");
  });
  $("btn-new-skill").addEventListener("click", () => {
    let id = "new_skill", i = 1;
    while (skill(id)) id = "new_skill_" + (++i);
    state.skills.push({ id, name: "Habilidad nueva", type: "?", tags: "", unlock: 1, damage: 0, useTime: 0.5, cooldown: 0, mana: 5, description: "", note: "", branches: ["Rama 1", "Rama 2", "Rama 3"], nodes: [] });
    current = id; selected = null; touch(); renderAll();
  });
  $("search").addEventListener("input", renderList);
  window.addEventListener("resize", () => { const s = skill(current); if (s) drawLinks(s); });

  function renderAll() { renderList(); renderBench(); renderInspector(); renderChanges(); }
  renderAll();
  setStatus(dirty ? "Tienes un borrador sin guardar de la última vez." : state.savedAt ? "Última versión guardada: " + new Date(state.savedAt).toLocaleString() : "Datos sacados del juego. Edita y guarda.");
})();
</script>
