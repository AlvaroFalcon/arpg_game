:root {

  --ember: #c4501f; --ember-soft: #f6dccd; --steel: #3d5d8a; --steel-soft: #dce5f2;
  --gold: #a87a1c; --new: #2f7d4f; --new-soft: #d8eedf; --cut: #a8323a; --cut-soft: #f5d9db;
  --notable-bg: #fff4e0; --special-bg: #efe4fb; --special: #7a4bb5; --edge: #8b7f8e;

  --display: "Alegreya SC", "Palatino Linotype", Georgia, serif;

  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}

  --ember: #f07a42; --ember-soft: #43271c; --steel: #8fb0e0; --steel-soft: #1f2a3c;
  --gold: #e0b450; --new: #6fd197; --new-soft: #1c3527; --cut: #f0737b; --cut-soft: #3e1d22;
  --notable-bg: #33281a; --special-bg: #2c2140; --special: #c39af0; --edge: #8a7f92; --s1: #e0682f; --s2: #5d93e0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #17141c; --panel: #201b27; --board: #1b1721; --dot: #342c3d; --ink: #ece4d8; --muted: #a59aa8; --line: #3a3244;
  --ember: #f07a42; --ember-soft: #43271c; --steel: #8fb0e0; --steel-soft: #1f2a3c;
  --gold: #e0b450; --new: #6fd197; --new-soft: #1c3527; --cut: #f0737b; --cut-soft: #3e1d22;
  --notable-bg: #33281a; --special-bg: #2c2140; --special: #c39af0; --edge: #8a7f92; --s1: #e0682f; --s2: #5d93e0; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 32px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
header.top h1 { font: 700 26px/1.1 var(--display); margin: 0; letter-spacing: .02em; color: var(--ember); text-wrap: balance; }
header.top .sub { color: var(--muted); font-size: 13px; }
header.top .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
button, .btn { font: 600 13px var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 11px; border-radius: 6px; cursor: pointer; }
button:hover, .btn:hover { border-color: var(--ember); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .gnode:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
button.primary { background: var(--ember); border-color: var(--ember); color: #fff; }
button.danger { color: var(--cut); }
button[disabled] { opacity: .5; cursor: default; }
.status { font-size: 12px; color: var(--muted); min-height: 1.4em; width: 100%; }
.grid { display: grid; grid-template-columns: 220px minmax(0, 1fr) 310px; gap: 14px; align-items: start; }
@media (max-width: 1150px) { .grid { grid-template-columns: 190px minmax(0, 1fr); } .inspector { grid-column: 1 / -1; } }
@media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.rack h2, .inspector h2 { font: 700 15px var(--display); letter-spacing: .04em; margin: 0 0 8px; color: var(--muted); }
.rack input[type=search] { width: 100%; margin-bottom: 8px; }
.skill-list { list-style: none; margin: 0; padding: 0; max-height: 68vh; overflow: auto; }
.skill-list li button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 6px; border: 0; border-radius: 5px; padding: 6px 8px; background: transparent; font-weight: 500; }
.skill-list li button[aria-current="true"] { background: var(--ember-soft); }
.skill-list .type { font: 400 11px var(--mono); color: var(--muted); }
.chip { display: inline-block; font: 600 10px/1 var(--mono); padding: 3px 5px; border-radius: 4px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.chip.new { background: var(--new-soft); color: var(--new); }
.chip.changed { background: var(--steel-soft); color: var(--steel); }
.chip.removed { background: var(--cut-soft); color: var(--cut); }
label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
input, select, textarea { font: 14px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 54px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 8px; }
.fields .wide { grid-column: 1 / -1; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bench { padding: 0; overflow: hidden; }
.bench-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 12px 12px 6px; }
.bench-head h2 { font: 700 24px var(--display); margin: 0; }
.bench-head .meta { font: 12px var(--mono); color: var(--muted); }
details.skill-fields { padding: 0 12px 8px; }
details.skill-fields summary { cursor: pointer; font-weight: 600; color: var(--steel); margin-bottom: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); align-items: center; }
.toolbar .hint { font-size: 12px; color: var(--muted); margin-left: auto; }
.board { position: relative; height: 62vh; min-height: 420px; overflow: hidden; background-color: var(--board);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); touch-action: none; cursor: grab; user-select: none; }
.board.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
svg.edges path.hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
svg.edges path.wire { fill: none; stroke: var(--edge); stroke-width: 2; }
svg.edges path.wire.sel { stroke: var(--ember); stroke-width: 3; }
svg.edges path.wire.new { stroke: var(--new); }
svg.edges path.wire.cut { stroke: var(--cut); stroke-dasharray: 5 4; }
svg.edges path.wire.draft { stroke: var(--ember); stroke-dasharray: 6 4; }
svg.edges .elabel rect { fill: var(--panel); stroke: var(--edge); }
svg.edges .elabel text { font: 600 11px var(--mono); fill: var(--ink); }
svg.edges .elabel { pointer-events: all; cursor: pointer; }
.gnode { position: absolute; width: 200px; border: 1.5px solid var(--line); background: var(--panel); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); cursor: move; }
.gnode.notable { background: var(--notable-bg); border-color: var(--gold); border-radius: 16px; }
.gnode.special { background: var(--special-bg); border-color: var(--special); border-width: 2px; }
.gnode.sel { box-shadow: 0 0 0 3px var(--ember-soft), 0 0 0 4.5px var(--ember); }
.gnode.st-new { border-color: var(--new); }
.gnode.st-changed { border-color: var(--steel); }
.gnode.st-removed { border-color: var(--cut); opacity: .55; }
.gnode .head { display: flex; justify-content: space-between; gap: 6px; padding: 7px 12px 2px; align-items: baseline; }
.gnode .title { font-weight: 600; font-size: 14px; }
.gnode.st-removed .title { text-decoration: line-through; }
.gnode .kind { font: 10px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.gnode .body { padding: 0 12px 8px; font-size: 12px; color: var(--muted); }
.gnode .tags { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 8px; }
.gnode .group { background: var(--notable-bg); color: var(--gold); border: 1px dashed var(--gold); }
.gnode .root { background: var(--steel-soft); color: var(--steel); }
.port { position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--panel); border: 2px solid var(--edge); cursor: crosshair; }
.port.in { left: -9px; }
.port.out { right: -9px; background: var(--edge); }
.port:hover, .port.hot { border-color: var(--ember); background: var(--ember); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding: 8px 12px 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 18px; height: 12px; border: 1.5px solid var(--line); border-radius: 3px; background: var(--panel); }
.swatch.notable { border-color: var(--gold); border-radius: 8px; background: var(--notable-bg); }
.swatch.special { border-color: var(--special); background: var(--special-bg); }
.inspector .empty { color: var(--muted); font-size: 13px; }
.ranks { display: grid; gap: 6px; }
.rank-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 30px; gap: 6px; align-items: center; }
.rank-row .r { font: 600 12px var(--mono); color: var(--muted); text-align: right; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.links-list { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 4px; font-size: 13px; }
.links-list li { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.changes { margin-top: 18px; }
.changes h2 { font: 700 18px var(--display); margin: 0 0 8px; }
.changes ol { margin: 8px 0 0; padding-left: 20px; font-size: 13px; display: grid; gap: 3px; }
.changes .none { color: var(--muted); font-size: 13px; }
.changes pre { white-space: pre-wrap; font: 12px/1.5 var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 280px; overflow: auto; }
/* Analysis: path on the left, small multiples (one metric per chart, one axis each) on the right. */
.tabs { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: transparent; padding: 6px 14px; }
.tabs button[aria-selected="true"] { background: var(--ember); color: #fff; }
.an-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.an-level { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink); }
.an-level input { width: 220px; accent-color: var(--ember); padding: 0; border: 0; background: transparent; }
.an-level output { font-weight: 600; font-size: 18px; min-width: 2ch; color: var(--ember); }
.an-layout { display: grid; grid-template-columns: minmax(250px, 330px) minmax(0, 1fr); gap: 0; }
@media (max-width: 900px) { .an-layout { grid-template-columns: minmax(0, 1fr); } }
.an-path { border-right: 1px solid var(--line); padding: 10px 12px; max-height: 78vh; overflow: auto; }
.an-path h3 { font: 700 15px var(--display); margin: 0 0 8px; display: grid; gap: 2px; }
.an-path h3 .meta, .meta { font: 12px var(--body); color: var(--muted); }
.an-gname { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 4px; }
.an-node { display: grid; grid-template-columns: 26px minmax(0, 1fr) 26px 38px; gap: 6px; align-items: start; padding: 5px 4px; border-radius: 6px; }
.an-node.on { background: var(--ember-soft); }
.an-node .pm { padding: 0; width: 26px; height: 26px; font-size: 16px; line-height: 1; }
.an-node .nm { font-size: 13px; display: grid; gap: 1px; }
.an-node .rk { font-size: 12px; color: var(--muted); }
.an-node .tx { font-size: 12px; color: var(--muted); }
.an-node .why { font-size: 11px; color: var(--muted); font-style: italic; }
.an-node .from { font-size: 11px; color: var(--muted); padding-top: 5px; }
.an-charts { padding: 10px 12px 12px; min-width: 0; }
.an-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.an-legend span, .an-tip span { display: inline-flex; align-items: center; gap: 6px; }
.ln { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--s1); }
.ln.none { border-top: 2px dashed var(--s2); }
.tk { display: inline-block; width: 2px; height: 8px; background: var(--muted); }
.an-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.an-card { margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px 2px; background: var(--bg); }
.an-card figcaption { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.an-card figcaption .num { color: var(--ink); }
.an-card svg { width: 100%; height: auto; display: block; overflow: visible; }
.an-card .g { stroke: var(--line); stroke-width: 1; }
.an-card .ax { font: 10px var(--mono); fill: var(--muted); }
.an-card .end { font: 600 10px var(--mono); fill: var(--ink); }
.an-card .end.muted { fill: var(--muted); font-weight: 400; }
.an-card .s-mine { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; }
.an-card .s-none { fill: none; stroke: var(--s2); stroke-width: 2; stroke-dasharray: 5 4; }
.an-card .dot-mine { fill: var(--s1); stroke: var(--bg); stroke-width: 2; }
.an-card .lvl { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.an-card .step { stroke: var(--muted); stroke-width: 2; }
.an-card .cross line { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.an-card .hitbox { fill: transparent; cursor: pointer; }
.an-note { font-size: 12px; color: var(--muted); margin: 10px 0 0; max-width: 80ch; }
.bench { position: relative; }
.an-tip { position: absolute; z-index: 5; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 12px; display: grid; gap: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; }
.an-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.an-table th, .an-table td { padding: 4px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.an-table th:first-child { text-align: left; font-weight: 500; }
.an-table thead th { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; }
.an-table tr.diff td:nth-child(2) { font-weight: 600; }
.an-blind { font-size: 12px; color: var(--muted); }
.an-spent li { display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<script id="app-src">
(function () {
  "use strict";
  const SHELL = `<div class="wrap" id="app">
  <header class="top">
    <h1>Escaldón's Workbench</h1>
    <span class="sub">Árboles de mejora: arrastra nodos, conéctalos con flechas y pon la condición de cada flecha.</span>
    <div class="actions">
      <button id="btn-save" class="primary" type="button">Guardar</button>
      <button id="btn-copy" type="button">Copiar cambios</button>
      <button id="btn-export" type="button">Exportar JSON</button>
      <label class="btn" for="file-import" style="display:inline-block">Importar JSON<input id="file-import" type="file" accept="application/json,.json" class="sr"></label>
      <button id="btn-reset" class="danger" type="button">Deshacer todo</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </header>
  <div class="grid">
    <nav class="panel rack" aria-label="Habilidades">
      <h2>Habilidades</h2>
      <input id="search" type="search" placeholder="Buscar…" aria-label="Buscar habilidad">
      <ul class="skill-list" id="skill-list"></ul>
      <div class="row"><button id="btn-new-skill" type="button">+ Habilidad nueva</button></div>
    </nav>
    <main class="panel bench" id="bench"></main>
    <aside class="panel inspector" id="inspector" aria-label="Selección"></aside>
  </div>
  <section class="changes" id="changes"></section>
</div>`;
  document.getElementById("root").innerHTML = SHELL;

  const STORE_KEY = "escaldon-workbench-graph-v2";
  const NODE_W = 200;
  const raw = JSON.parse(document.getElementById("tree-data").textContent);

  // --- data: every skill becomes a graph (nodes with x/y, edges with a condition) ---------
  function toGraph(s) {
    if (Array.isArray(s.edges)) return s;
    const g = JSON.parse(JSON.stringify(s));
    const perCell = {};
    g.edges = [];
    for (const n of g.nodes) {
      const key = n.branch + ":" + n.depth;
      const k = perCell[key] = (perCell[key] || 0) + 1;
      n.x = 40 + n.depth * 260;
      n.y = 40 + n.branch * 230 + (k - 1) * 110;
      const parents = Array.isArray(n.parents) && n.parents.length ? n.parents : n.requires ? [{ id: n.requires, ranks: n.requiresRanks || 1 }] : [];
      for (const p of parents) g.edges.push({ from: p.id, to: n.id, ranks: p.ranks || 1 });
      delete n.requires; delete n.requiresRanks; delete n.parents;
      n.note = n.note || "";
    }
    g.note = g.note || "";
    return g;
  }
  const state = {
    base: (raw.base || raw.skills).map(toGraph),
    skills: (raw.edited || raw.skills).map(toGraph),
    savedAt: raw.savedAt || null,
    note: raw.note || "",
  };
  if (!raw.base) state.base = JSON.parse(JSON.stringify(state.skills));
  let current = state.skills[0] ? state.skills[0].id : null;
  let sel = null; // { type: "node", id } | { type: "edge", from, to }
  let dirty = false;
  const views = {}; // per-skill pan/zoom
  let mode = "tree"; // "tree" (edit the graph) | "analysis" (charts of a path)
  try { if (localStorage.getItem("escaldon-workbench-analysis-v1-mode") === "analysis") mode = "analysis"; } catch (e) { /* ignore */ }

  // The game's data has a version (build.py hashes it): a draft made on older data would
  // otherwise bring back old numbers (a cooldown already changed in the game) without a word.
  const DATA_VERSION = raw.version || "";
  let staleDraft = false;
  try {
    const draft = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (draft && draft.savedAt === state.savedAt && (draft.version || "") === DATA_VERSION && Array.isArray(draft.skills)) { state.skills = draft.skills.map(toGraph); state.note = draft.note || ""; dirty = true; }
    else if (draft) { staleDraft = true; localStorage.removeItem(STORE_KEY); }
  } catch (e) { /* storage unavailable: work in memory */ }

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const skill = id => state.skills.find(s => s.id === id);
  const baseSkill = id => state.base.find(s => s.id === id);
  const baseNode = (sid, nid) => (baseSkill(sid)?.nodes || []).find(n => n.id === nid);
  const baseEdge = (sid, e) => (baseSkill(sid)?.edges || []).find(b => b.from === e.from && b.to === e.to);
  const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "node";
  const kindLabel = k => ({ Lesser: "Menor", Notable: "Notable", Special: "Especial" }[k] || k);

  function nodeStatus(sid, n) {
    if (n.removed) return "removed";
    const b = baseNode(sid, n.id);
    if (!b) return "new";
    if (["name", "kind", "exclusive", "note"].some(k => (b[k] ?? "") !== (n[k] ?? "")) || JSON.stringify(b.ranks) !== JSON.stringify(n.ranks)) return "changed";
    return "";
  }
  function edgeStatus(sid, e) {
    if (e.removed) return "removed";
    const b = baseEdge(sid, e);
    if (!b) return "new";
    return b.ranks !== e.ranks || (b.note || "") !== (e.note || "") ? "changed" : "";
  }
  function skillStatus(s) {
    const b = baseSkill(s.id);
    if (!b) return "new";
    if (["name", "unlock", "damage", "useTime", "cooldown", "mana", "description", "note"].some(k => (b[k] ?? "") !== (s[k] ?? ""))) return "changed";
    if (s.nodes.some(n => nodeStatus(s.id, n)) || s.edges.some(e => edgeStatus(s.id, e))) return "changed";
    if (b.nodes.some(n => !s.nodes.find(x => x.id === n.id)) || b.edges.some(e => !s.edges.find(x => x.from === e.from && x.to === e.to))) return "changed";
    return "";
  }

  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ savedAt: state.savedAt, version: DATA_VERSION, skills: state.skills, note: state.note })); } catch (e) { /* ignore */ }
  }
  function touch() { dirty = true; persist(); renderList(); renderChanges(); setStatus("Cambios sin guardar."); }
  function setStatus(t) { $("status").textContent = t; }

  // --- the rack --------------------------------------------------------------------
  function renderList() {
    const q = $("search").value.trim().toLowerCase();
    const ul = $("skill-list");
    ul.innerHTML = "";
    for (const s of state.skills) {
      if (q && !(s.name + " " + s.id + " " + s.type).toLowerCase().includes(q)) continue;
      const st = skillStatus(s);
      const li = document.createElement("li");
      li.innerHTML = `<button type="button" aria-current="${s.id === current}"><span>${esc(s.name)}<br><span class="type">${esc(s.type)} · nv ${esc(s.unlock)}</span></span>${st ? `<span class="chip ${st}">${st === "new" ? "nueva" : "cambios"}</span>` : ""}</button>`;
      li.firstChild.addEventListener("click", () => { current = s.id; sel = null; renderAll(); });
      ul.appendChild(li);
    }
  }

  // --- the bench: header, toolbar, board ---------------------------------------------
  function renderBench() {
    const s = skill(current);
    const bench = $("bench");
    if (!s) { bench.innerHTML = `<p class="empty" style="padding:12px">Elige una habilidad.</p>`; return; }
    if (mode === "analysis") return renderAnalysis(s);
    const live = s.nodes.filter(n => !n.removed);
    const points = live.filter(n => !n.exclusive).reduce((a, n) => a + n.ranks.length, 0) + new Set(live.filter(n => n.exclusive).map(n => n.exclusive)).size;
    bench.innerHTML = `
      <div class="bench-head"><h2>${esc(s.name)}</h2><span class="meta">${esc(s.id)} · ${esc(s.type)}</span>
        <span class="meta num">${points} rangos · ${live.filter(n => !s.edges.some(e => e.to === n.id && !e.removed)).length} nodos de inicio · una gema de nivel 20 tiene 19 puntos</span>${tabs()}</div>
      <details class="skill-fields" ${skillStatus(s) === "new" ? "open" : ""}><summary>Datos de la habilidad</summary>
        <div class="fields">
          <label>Nombre<input id="f-name" value="${esc(s.name)}"></label>
          <label>Nivel para comprarla<input id="f-unlock" class="num" type="number" min="1" value="${esc(s.unlock)}"></label>
          <label>Daño base<input id="f-damage" class="num" type="number" step="any" value="${esc(s.damage)}"></label>
          <label>Tiempo de uso (s)<input id="f-useTime" class="num" type="number" step="any" value="${esc(s.useTime)}"></label>
          <label>Cooldown (s)<input id="f-cooldown" class="num" type="number" step="any" value="${esc(s.cooldown)}"></label>
          <label>Maná (nivel 1)<input id="f-mana" class="num" type="number" step="any" value="${esc(s.mana)}"></label>
          <label class="wide">Descripción<textarea id="f-description">${esc(s.description)}</textarea></label>
          <label class="wide">Notas para Claude<textarea id="f-note" placeholder="Qué quieres cambiar y por qué">${esc(s.note || "")}</textarea></label>
        </div>
      </details>
      <div class="toolbar">
        <button type="button" data-add="Lesser">+ Menor</button>
        <button type="button" data-add="Notable">+ Notable</button>
        <button type="button" data-add="Special">+ Especial</button>
        <button type="button" id="btn-fit">Encuadrar</button>
        <button type="button" id="btn-layout">Ordenar</button>
        <span class="hint">Arrastra el fondo para moverte · rueda para zoom · arrastra del punto derecho de un nodo al izquierdo de otro para unirlos · doble clic en el fondo crea un nodo · Supr borra</span>
      </div>
      <div class="board" id="board" tabindex="0" aria-label="Árbol de ${esc(s.name)}">
        <div class="world" id="world"><svg class="edges" id="edges"></svg></div>
      </div>
      <div class="legend"><span><i class="swatch"></i>Menor (varios rangos)</span><span><i class="swatch notable"></i>Notable</span><span><i class="swatch special"></i>Especial</span>
        <span>Flecha: «necesita N puntos en el nodo de origen». Varias flechas a un nodo: vale cualquiera de los caminos.</span>
        <span>Nodo sin flechas de entrada: nodo de inicio.</span><span>Etiqueta punteada: grupo «elige uno».</span></div>`;
    for (const k of ["name", "unlock", "damage", "useTime", "cooldown", "mana", "description", "note"]) {
      const el = $("f-" + k);
      el.addEventListener("change", () => { s[k] = el.type === "number" ? Number(el.value) : el.value; touch(); if (k === "name") renderBench(); });
    }
    bench.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
      const v = view(s), board = $("board").getBoundingClientRect();
      addNode(s, b.dataset.add, (board.width / 2 - v.x) / v.k - NODE_W / 2, (board.height / 2 - v.y) / v.k - 40);
    }));
    $("btn-fit").addEventListener("click", () => { fit(s); applyView(s); });
    $("btn-layout").addEventListener("click", () => { autoLayout(s); touch(); drawNodes(s); fit(s); applyView(s); });
    bindTabs();
    drawNodes(s);
    bindBoard(s);
    if (!views[s.id]) fit(s);
    applyView(s);
  }

  function view(s) { return views[s.id] || (views[s.id] = { x: 20, y: 20, k: 1 }); }
  function applyView(s) {
    const v = view(s);
    $("world").style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.k})`;
    $("board").style.backgroundSize = `${22 * v.k}px ${22 * v.k}px`;
    $("board").style.backgroundPosition = `${v.x}px ${v.y}px`;
  }
  function fit(s) {
    const board = $("board");
    if (!board || !s.nodes.length) return;
    const xs = s.nodes.map(n => n.x), ys = s.nodes.map(n => n.y);
    const minX = Math.min(...xs) - 40, minY = Math.min(...ys) - 40, maxX = Math.max(...xs) + NODE_W + 40, maxY = Math.max(...ys) + 150;
    const r = board.getBoundingClientRect();
    const k = Math.max(0.35, Math.min(1.1, Math.min(r.width / (maxX - minX), r.height / (maxY - minY))));
    views[s.id] = { k, x: (r.width - (maxX - minX) * k) / 2 - minX * k, y: (r.height - (maxY - minY) * k) / 2 - minY * k };
  }
  function autoLayout(s) {
    // Columns by longest path from a start node; rows by order inside each column.
    const depth = {};
    const live = s.nodes.filter(n => !n.removed);
    const incoming = id => s.edges.filter(e => e.to === id && !e.removed);
    const d = (id, seen = new Set()) => {
      if (depth[id] !== undefined) return depth[id];
      if (seen.has(id)) return 0;
      seen.add(id);
      const ins = incoming(id);
      return depth[id] = ins.length ? 1 + Math.max(...ins.map(e => d(e.from, seen))) : 0;
    };
    live.forEach(n => d(n.id));
    const cols = {};
    live.sort((a, b) => a.y - b.y).forEach(n => { (cols[depth[n.id]] = cols[depth[n.id]] || []).push(n); });
    Object.entries(cols).forEach(([c, list]) => list.forEach((n, i) => { n.x = 40 + Number(c) * 260; n.y = 40 + i * 130; }));
  }

  function drawNodes(s) {
    const world = $("world");
    world.querySelectorAll(".gnode").forEach(n => n.remove());
    for (const n of s.nodes) {
      const st = nodeStatus(s.id, n);
      const isRoot = !n.removed && !s.edges.some(e => e.to === n.id && !e.removed);
      const el = document.createElement("div");
      el.className = `gnode ${n.kind === "Notable" ? "notable" : n.kind === "Special" ? "special" : ""} ${st ? "st-" + st : ""} ${sel && sel.type === "node" && sel.id === n.id ? "sel" : ""}`;
      el.dataset.id = n.id;
      el.tabIndex = 0;
      el.style.left = n.x + "px"; el.style.top = n.y + "px";
      const ranks = n.ranks.length > 1 ? `${n.ranks.length} rangos: ${esc(n.ranks[0])} → ${esc(n.ranks[n.ranks.length - 1])}` : esc(n.ranks[0] || "—");
      el.innerHTML = `<div class="head"><span class="title">${esc(n.name)}</span><span class="kind">${kindLabel(n.kind)}</span></div>
        <div class="body">${ranks}</div>
        <div class="tags">${isRoot ? `<span class="chip root">inicio</span>` : ""}${n.exclusive ? `<span class="chip group">elige uno: ${esc(n.exclusive)}</span>` : ""}${st ? `<span class="chip ${st}">${st === "new" ? "nuevo" : st === "removed" ? "quitar" : "cambio"}</span>` : ""}</div>
        <span class="port in" data-port="in" title="Entrada"></span><span class="port out" data-port="out" title="Arrastra para conectar"></span>`;
      world.appendChild(el);
    }
    drawEdges(s);
  }

  function anchor(s, id, side) {
    const n = s.nodes.find(x => x.id === id);
    const el = $("world").querySelector(`.gnode[data-id="${CSS.escape(id)}"]`);
    if (!n || !el) return null;
    return { x: n.x + (side === "out" ? NODE_W : 0), y: n.y + el.offsetHeight / 2 };
  }
  function wire(a, b) {
    const dx = Math.max(40, Math.abs(b.x - a.x) / 2);
    return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
  }
  let draft = null; // a wire being dragged from an output port
  function drawEdges(s) {
    const svg = $("edges");
    let html = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker>
      <marker id="arrow-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ember)"/></marker></defs>`;
    s.edges.forEach((e, i) => {
      const a = anchor(s, e.from, "out"), b = anchor(s, e.to, "in");
      if (!a || !b) return;
      const st = edgeStatus(s.id, e);
      const isSel = sel && sel.type === "edge" && sel.from === e.from && sel.to === e.to;
      const d = wire(a, b);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const label = `≥ ${e.ranks} pt`;
      html += `<path class="wire ${isSel ? "sel" : st === "new" ? "new" : st === "removed" ? "cut" : ""}" d="${d}" marker-end="url(#${isSel ? "arrow-sel" : "arrow"})"/>`;
      html += `<path class="hit" d="${d}" data-edge="${i}"/>`;
      html += `<g class="elabel" data-edge="${i}"><rect x="${mx - 26}" y="${my - 10}" width="52" height="20" rx="10"/><text x="${mx}" y="${my + 4}" text-anchor="middle">${label}</text></g>`;
    });
    if (draft) html += `<path class="wire draft" d="${wire(draft.a, draft.b)}"/>`;
    svg.innerHTML = html;
  }

  // --- board interaction: pan, zoom, drag nodes, draw wires ---------------------------------
  function bindBoard(s) {
    const board = $("board");
    const toWorld = (cx, cy) => { const r = board.getBoundingClientRect(), v = view(s); return { x: (cx - r.left - v.x) / v.k, y: (cy - r.top - v.y) / v.k }; };
    let drag = null;
    board.addEventListener("pointerdown", ev => {
      if (ev.button !== 0 && ev.button !== 1) return;
      const port = ev.target.closest(".port");
      const nodeEl = ev.target.closest(".gnode");
      const edgeEl = ev.target.closest("[data-edge]");
      board.setPointerCapture(ev.pointerId);
      if (port && port.dataset.port === "out" && nodeEl) {
        const from = nodeEl.dataset.id;
        draft = { from, a: anchor(s, from, "out"), b: toWorld(ev.clientX, ev.clientY) };
        drag = { type: "wire" };
      } else if (nodeEl && ev.button === 0) {
        const n = s.nodes.find(x => x.id === nodeEl.dataset.id);
        const p = toWorld(ev.clientX, ev.clientY);
        drag = { type: "node", n, dx: p.x - n.x, dy: p.y - n.y, moved: false };
        select({ type: "node", id: n.id }, s);
      } else if (edgeEl) {
        const e = s.edges[Number(edgeEl.dataset.edge)];
        select({ type: "edge", from: e.from, to: e.to }, s);
        drag = null;
      } else {
        drag = { type: "pan", sx: ev.clientX, sy: ev.clientY, vx: view(s).x, vy: view(s).y };
        board.classList.add("panning");
      }
    });
    board.addEventListener("pointermove", ev => {
      if (!drag) return;
      if (drag.type === "pan") {
        const v = view(s); v.x = drag.vx + ev.clientX - drag.sx; v.y = drag.vy + ev.clientY - drag.sy; applyView(s);
      } else if (drag.type === "node") {
        const p = toWorld(ev.clientX, ev.clientY);
        drag.n.x = Math.round((p.x - drag.dx) / 10) * 10; drag.n.y = Math.round((p.y - drag.dy) / 10) * 10; drag.moved = true;
        const el = $("world").querySelector(`.gnode[data-id="${CSS.escape(drag.n.id)}"]`);
        el.style.left = drag.n.x + "px"; el.style.top = drag.n.y + "px";
        drawEdges(s);
      } else if (drag.type === "wire") {
        draft.b = toWorld(ev.clientX, ev.clientY);
        board.querySelectorAll(".port.hot").forEach(p => p.classList.remove("hot"));
        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        const target = under && under.closest(".gnode");
        if (target && target.dataset.id !== draft.from) target.querySelector(".port.in").classList.add("hot");
        drawEdges(s);
      }
    });
    const end = ev => {
      if (!drag) return;
      board.classList.remove("panning");
      if (drag.type === "node" && drag.moved) persist();
      if (drag.type === "wire") {
        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        const target = under && under.closest(".gnode");
        const from = draft.from;
        draft = null;
        if (target && target.dataset.id !== from) connect(s, from, target.dataset.id);
        else drawEdges(s);
      }
      drag = null;
    };
    board.addEventListener("pointerup", end);
    board.addEventListener("pointercancel", end);
    board.addEventListener("wheel", ev => {
      ev.preventDefault();
      const v = view(s), r = board.getBoundingClientRect();
      const k = Math.max(0.3, Math.min(2, v.k * (ev.deltaY < 0 ? 1.1 : 1 / 1.1)));
      const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
      v.x = cx - (cx - v.x) * (k / v.k); v.y = cy - (cy - v.y) * (k / v.k); v.k = k;
      applyView(s);
    }, { passive: false });
    board.addEventListener("dblclick", ev => {
      if (ev.target.closest(".gnode")) return;
      const p = toWorld(ev.clientX, ev.clientY);
      addNode(s, "Lesser", p.x - NODE_W / 2, p.y - 30);
    });
    board.addEventListener("keydown", ev => {
      if ((ev.key === "Delete" || ev.key === "Backspace") && sel) { ev.preventDefault(); removeSelected(s); }
    });
  }

  function select(next, s) {
    sel = next;
    drawNodes(s);
    renderInspector();
  }

  function connect(s, from, to) {
    if (s.edges.some(e => e.from === from && e.to === to && !e.removed)) { setStatus("Esos dos nodos ya están unidos."); drawEdges(s); return; }
    if (reaches(s, to, from)) { setStatus("Esa flecha haría un círculo: un nodo no puede necesitarse a sí mismo."); drawEdges(s); return; }
    const old = s.edges.find(e => e.from === from && e.to === to && e.removed);
    const src = s.nodes.find(n => n.id === from);
    if (old) delete old.removed; else s.edges.push({ from, to, ranks: Math.min(2, Math.max(1, src ? src.ranks.length : 1)), note: "" });
    sel = { type: "edge", from, to };
    touch(); drawNodes(s); renderInspector();
  }
  function reaches(s, start, goal) {
    const stack = [start], seen = new Set();
    while (stack.length) {
      const id = stack.pop();
      if (id === goal) return true;
      if (seen.has(id)) continue;
      seen.add(id);
      s.edges.filter(e => e.from === id && !e.removed).forEach(e => stack.push(e.to));
    }
    return false;
  }

  function addNode(s, kind, x, y) {
    let id = "new_node", i = 1;
    while (s.nodes.some(n => n.id === id)) id = "new_node_" + (++i);
    const n = { id, name: kind === "Special" ? "Nodo especial" : kind === "Notable" ? "Notable nuevo" : "Nodo nuevo", kind,
      ranks: kind === "Lesser" ? ["Rango 1", "Rango 2", "Rango 3"] : ["Qué hace"], exclusive: "", note: "",
      x: Math.round(x / 10) * 10, y: Math.round(y / 10) * 10, branch: 0, depth: 0 };
    s.nodes.push(n);
    sel = { type: "node", id };
    touch(); drawNodes(s); renderInspector();
  }

  function removeSelected(s) {
    if (!sel) return;
    if (sel.type === "edge") {
      const e = s.edges.find(x => x.from === sel.from && x.to === sel.to);
      if (e) { if (baseEdge(s.id, e)) e.removed = true; else s.edges.splice(s.edges.indexOf(e), 1); }
    } else {
      const n = s.nodes.find(x => x.id === sel.id);
      if (!n) return;
      if (baseNode(s.id, n.id)) { n.removed = true; s.edges.filter(e => e.from === n.id || e.to === n.id).forEach(e => { if (baseEdge(s.id, e)) e.removed = true; }); }
      else s.nodes.splice(s.nodes.indexOf(n), 1);
      s.edges = s.edges.filter(e => e.removed || (s.nodes.some(x => x.id === e.from) && s.nodes.some(x => x.id === e.to)));
    }
    sel = null;
    touch(); drawNodes(s); renderInspector();
  }

  // --- analysis: pick a path, slide the gem level, watch the numbers --------------------
  // Each node rank carries its numeric effect, measured by the game (DumpSkillTrees): factors
  // multiply, "max" keys take the largest, the rest add. Gem level L has L-1 points, spent in
  // the order the path was clicked, so the curve shows when each node kicks in.
  const MULT = new Set(["damage", "cost", "cooldown", "useTime", "area", "duration", "range", "igniteDamage", "projectileSpeed", "projectileRange", "passive", "active", "drain"]);
  const MAXK = new Set(["burst", "burstShare", "killBlast", "oilSlow", "splash", "stacksKept"]);
  const ANAL_KEY = "escaldon-workbench-analysis-v1";
  let anal = {};
  try { anal = JSON.parse(localStorage.getItem(ANAL_KEY) || "{}") || {}; } catch (e) { anal = {}; }
  const analOf = s => anal[s.id] || (anal[s.id] = { path: [], level: 20 });
  function persistAnal() { try { localStorage.setItem(ANAL_KEY, JSON.stringify(anal)); } catch (e) { /* ignore */ } }
  const liveNode = (s, id) => s.nodes.find(n => n.id === id && !n.removed);

  function ranksOf(path) { const r = {}; for (const id of path) r[id] = (r[id] || 0) + 1; return r; }
  // Why a point cannot go into node n now (null = it can).
  function blocker(s, n, r) {
    if ((r[n.id] || 0) >= n.ranks.length) return "Ya está al máximo";
    if (n.exclusive) {
      const other = s.nodes.find(o => o !== n && !o.removed && o.exclusive === n.exclusive && r[o.id]);
      if (other) return "Elige uno: ya tienes " + other.name;
    }
    const ins = s.edges.filter(e => e.to === n.id && !e.removed && liveNode(s, e.from));
    if (ins.length && !ins.some(e => (r[e.from] || 0) >= (e.ranks || 1)))
      return "Necesita " + ins.map(e => (e.ranks || 1) + " en " + liveNode(s, e.from).name).join(" o ");
    return null;
  }
  // Replays a path, dropping points that are no longer legal (after a removal or an edit).
  function cleanPath(s, path) {
    const out = [], r = {};
    for (const id of path) { const n = liveNode(s, id); if (n && !blocker(s, n, r)) { out.push(id); r[id] = (r[id] || 0) + 1; } }
    return out;
  }

  function combine(s, ranks) {
    const E = { converts: "" }, blind = [];
    for (const [id, k] of Object.entries(ranks)) {
      const n = liveNode(s, id);
      const eff = n && Array.isArray(n.effects) ? n.effects[k - 1] : null;
      if (!eff || !Object.keys(eff).length) { if (n) blind.push(n.name); continue; }
      for (const [key, v] of Object.entries(eff)) {
        if (key === "converts") E.converts = v;
        else if (MULT.has(key)) E[key] = (E[key] ?? 1) * v;
        else if (MAXK.has(key)) E[key] = Math.max(E[key] ?? 0, v);
        else E[key] = (E[key] ?? 0) + v;
      }
    }
    return { E, blind };
  }
  const f = (E, k) => E[k] ?? (MULT.has(k) ? 1 : 0);

  function metrics(s, L, path) {
    const ranks = ranksOf(path.slice(0, Math.max(0, L - 1)));
    const { E, blind } = combine(s, ranks);
    const lv = L - 1, isAura = /aura/i.test(s.type || "");
    const dmg = (s.damage || 0) * (1 + (s.damagePerLevel ?? 0.12) * lv) * f(E, "damage");
    const burst = Math.max(s.burst || 0, f(E, "burst")) > 0;
    const share = burst ? Math.max(f(E, "burstShare"), s.burst ? s.burstShare || 0 : 0) : 0;
    const perTarget = dmg * (1 + share);
    const hits = ((s.hits || 1) + f(E, "extraHits")) * (1 + f(E, "repeats"));
    const mana = (s.mana || 0) * (1 + (s.costPerLevel ?? 0.02) * lv) * f(E, "cost");
    const cd = (s.cooldown || 0) * f(E, "cooldown"), ut = (s.useTime || 0) * f(E, "useTime");
    const period = Math.max(ut, cd, 0.05);
    const auraLv = 1 + (s.auraPerLevel ?? 0.03) * lv;
    return {
      L, E, blind, ranks, burst, share, hits, isAura,
      dmg, perTarget, mana, cd, ut,
      dps: perTarget * hits / period, mps: mana / period,
      passive: isAura ? auraLv * f(E, "passive") * 100 : 0,
      active: isAura ? auraLv * f(E, "active") * 100 : 0,
    };
  }

  const fmt = (v, d = 1) => (Math.abs(v) >= 100 ? Math.round(v).toLocaleString("es") : (Math.round(v * 10 ** d) / 10 ** d).toLocaleString("es"));
  const CHARTS = [
    { k: "dmg", t: "Daño por golpe", u: "", show: s => s.damage > 0 },
    { k: "dps", t: "DPS estimado (un enemigo)", u: "", show: s => s.damage > 0 },
    { k: "mana", t: "Coste de maná", u: "", show: () => true },
    { k: "mps", t: "Maná por segundo usándola sin parar", u: "/s", show: () => true },
    { k: "cd", t: "Cooldown", u: " s", show: (s, a) => a.some(m => m.cd > 0) },
    { k: "ut", t: "Tiempo de uso", u: " s", d: 2, show: () => true },
    { k: "hits", t: "Golpes por uso", u: "", show: (s, a) => a.some(m => m.hits !== a[0].hits) },
    { k: "passive", t: "Fuerza del pasivo (% del base)", u: "%", show: s => /aura/i.test(s.type || "") },
    { k: "active", t: "Fuerza del activo (% del base)", u: "%", show: s => /aura/i.test(s.type || "") },
  ];

  function chartSvg(c, mine, none, level, steps) {
    const W = 300, H = 160, P = { l: 38, r: 46, t: 10, b: 24 };
    const vals = mine.map(m => m[c.k]).concat(none.map(m => m[c.k]));
    let max = Math.max(...vals, 0);
    if (max <= 0) max = 1;
    const nice = (() => { const e = 10 ** Math.floor(Math.log10(max)); for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= max) return m * e; return 10 * e; })();
    const x = L => P.l + (L - 1) / 19 * (W - P.l - P.r), y = v => H - P.b - v / nice * (H - P.t - P.b);
    const line = arr => arr.map((m, i) => (i ? "L" : "M") + x(m.L).toFixed(1) + " " + y(m[c.k]).toFixed(1)).join("");
    const grid = [0, 0.5, 1].map(t => `<line class="g" x1="${P.l}" x2="${W - P.r}" y1="${y(nice * t)}" y2="${y(nice * t)}"/><text class="ax" x="${P.l - 6}" y="${y(nice * t) + 4}" text-anchor="end">${fmt(nice * t, c.d ?? 1)}</text>`).join("");
    const xt = [1, 5, 10, 15, 20].map(L => `<text class="ax" x="${x(L)}" y="${H - 8}" text-anchor="middle">${L}</text>`).join("");
    const ticks = steps.map(L => `<line class="step" x1="${x(L)}" x2="${x(L)}" y1="${H - P.b}" y2="${H - P.b + 5}"/>`).join("");
    let ya = y(mine[19][c.k]), yb = y(none[19][c.k]);
    if (Math.abs(ya - yb) < 13) { const mid = (ya + yb) / 2, up = ya <= yb ? -1 : 1; ya = mid + up * 6.5; yb = mid - up * 6.5; }
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.t)} del nivel 1 al 20">
      ${grid}${xt}${ticks}
      <line class="lvl" x1="${x(level)}" x2="${x(level)}" y1="${P.t}" y2="${H - P.b}"/>
      <path class="s-mine" d="${line(mine)}"/><path class="s-none" d="${line(none)}"/>
      <circle class="dot-mine" cx="${x(level)}" cy="${y(mine[level - 1][c.k])}" r="4"/>
      <text class="end" x="${W - P.r + 6}" y="${ya + 4}">${fmt(mine[19][c.k], c.d ?? 1)}</text>
      <text class="end muted" x="${W - P.r + 6}" y="${yb + 4}">${fmt(none[19][c.k], c.d ?? 1)}</text>
      <g class="cross" visibility="hidden"><line x1="0" x2="0" y1="${P.t}" y2="${H - P.b}"/></g>
      <rect class="hitbox" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" data-chart="${c.k}"/>
    </svg>`;
  }

  function renderAnalysis(s) {
    const A = analOf(s);
    A.path = cleanPath(s, A.path);
    const L = A.level = Math.min(20, Math.max(1, A.level | 0 || 20));
    const mine = [], none = [];
    for (let l = 1; l <= 20; l++) { mine.push(metrics(s, l, A.path)); none.push(metrics(s, l, [])); }
    const steps = A.path.slice(0, 19).map((_, i) => i + 2);
    const r = ranksOf(A.path);
    const groups = {};
    for (const n of s.nodes.filter(n => !n.removed)) {
      const g = (s.branches || [])[n.branch] ?? "Otros";
      (groups[g] = groups[g] || []).push(n);
    }
    const bench = $("bench");
    bench.innerHTML = `
      <div class="bench-head"><h2>${esc(s.name)}</h2><span class="meta">${esc(s.id)} · ${esc(s.type)}</span>${tabs()}</div>
      <div class="an-controls">
        <label class="an-level">Nivel de la gema <output class="num" id="an-level-out">${L}</output>
          <input id="an-level" type="range" min="1" max="20" step="1" value="${L}"></label>
        <span class="meta num">${A.path.length} puntos en tu camino · al nivel ${L} tienes ${L - 1} · ${Math.min(L - 1, A.path.length)} gastados</span>
        <span class="row" style="margin:0"><button type="button" id="an-undo" ${A.path.length ? "" : "disabled"}>Quitar el último</button><button type="button" id="an-clear" class="danger" ${A.path.length ? "" : "disabled"}>Vaciar camino</button></span>
      </div>
      <div class="an-layout">
        <div class="an-path">
          <h3>Tu camino <span class="meta">pulsa + en el orden en que gastarías los puntos</span></h3>
          ${Object.entries(groups).map(([g, ns]) => `<div class="an-group"><div class="an-gname">${esc(g)}</div>${ns.map(n => {
            const k = r[n.id] || 0, why = blocker(s, n, r), used = A.path.indexOf(n.id);
            const hasNums = Array.isArray(n.effects) && n.effects.some(e => e && Object.keys(e).length);
            return `<div class="an-node ${k ? "on" : ""}">
              <button type="button" class="pm" data-minus="${esc(n.id)}" ${k ? "" : "disabled"} aria-label="Quitar un punto de ${esc(n.name)}">−</button>
              <span class="nm"><b>${esc(n.name)}</b> <span class="num rk">${k}/${n.ranks.length}</span>${hasNums ? "" : ` <span class="chip changed" title="El juego no da números para este nodo: no entra en las gráficas">ver texto</span>`}
                <span class="tx">${esc(n.ranks[Math.max(0, k - 1)] || "")}</span>${why && !k ? `<span class="why">${esc(why)}</span>` : ""}</span>
              <button type="button" class="pm" data-plus="${esc(n.id)}" ${why ? `disabled title="${esc(why)}"` : ""} aria-label="Añadir un punto a ${esc(n.name)}">+</button>
              ${used >= 0 ? `<span class="from num" title="Nivel de la gema en que entra el primer punto">nv ${used + 2}</span>` : `<span class="from"></span>`}
            </div>`;
          }).join("")}</div>`).join("")}
        </div>
        <div class="an-charts">
          <div class="an-legend"><span><i class="ln mine"></i>Con tu camino</span><span><i class="ln none"></i>Sin árbol (solo nivel)</span><span><i class="tk"></i>Nivel en que entra un punto</span></div>
          <div class="an-grid">${CHARTS.filter(c => c.show(s, mine)).map(c => `<figure class="an-card"><figcaption>${esc(c.t)}<span class="num">${fmt(mine[L - 1][c.k], c.d ?? 1)}${c.u}</span></figcaption>${chartSvg(c, mine, none, L, steps)}</figure>`).join("")}</div>
          <p class="an-note">Cuentas de la habilidad sola: sin estadísticas del personaje, pasivas, soportes, críticos ni daño en el tiempo (quemadura, sangrado). El DPS supone que todos los golpes y la explosión dan al mismo enemigo y que la usas en cuanto puedes (lo que tarde más: tiempo de uso o cooldown). Usa los números de la ficha de arriba, así que si editas el cooldown o el maná lo verás aquí.</p>
        </div>
      </div>
      <div class="an-tip" id="an-tip" hidden></div>`;
    bindTabs();
    $("an-level").addEventListener("input", e => { A.level = Number(e.target.value); persistAnal(); renderAnalysis(s); renderInspector(); $("an-level").focus(); });
    $("an-undo").addEventListener("click", () => { A.path.pop(); persistAnal(); renderAnalysis(s); renderInspector(); });
    $("an-clear").addEventListener("click", () => { A.path = []; persistAnal(); renderAnalysis(s); renderInspector(); });
    bench.querySelectorAll("[data-plus]").forEach(b => b.addEventListener("click", () => { A.path.push(b.dataset.plus); persistAnal(); renderAnalysis(s); renderInspector(); }));
    bench.querySelectorAll("[data-minus]").forEach(b => b.addEventListener("click", () => {
      const i = A.path.lastIndexOf(b.dataset.minus); if (i >= 0) A.path.splice(i, 1); persistAnal(); renderAnalysis(s); renderInspector();
    }));
    const tip = $("an-tip");
    bench.querySelectorAll(".hitbox").forEach(h => {
      const c = CHARTS.find(c => c.k === h.dataset.chart), svg = h.ownerSVGElement, cross = svg.querySelector(".cross");
      const levelAt = ev => { const b = h.getBoundingClientRect(); return Math.min(20, Math.max(1, Math.round(1 + (ev.clientX - b.left) / b.width * 19))); };
      h.addEventListener("pointermove", ev => {
        const l = levelAt(ev), m = mine[l - 1], o = none[l - 1];
        const vb = svg.viewBox.baseVal, bx = h.x.baseVal.value + (l - 1) / 19 * h.width.baseVal.value;
        cross.setAttribute("visibility", "visible"); cross.setAttribute("transform", `translate(${bx},0)`);
        const spent = l >= 2 && A.path[l - 2] ? liveNode(s, A.path[l - 2]) : null;
        tip.innerHTML = `<b>Nivel ${l}</b><span><i class="ln mine"></i>Con tu camino <b class="num">${fmt(m[c.k], c.d ?? 1)}${c.u}</b></span><span><i class="ln none"></i>Sin árbol <b class="num">${fmt(o[c.k], c.d ?? 1)}${c.u}</b></span>${spent ? `<span class="meta">+1 punto en ${esc(spent.name)}</span>` : ""}`;
        tip.hidden = false;
        const br = bench.getBoundingClientRect(), tw = tip.offsetWidth;
        let left = ev.clientX - br.left + 14; if (left + tw > br.width - 8) left = ev.clientX - br.left - tw - 14;
        tip.style.left = left + "px"; tip.style.top = (ev.clientY - br.top + 14) + "px";
        void vb;
      });
      h.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.hidden = true; });
      h.addEventListener("click", ev => { A.level = levelAt(ev); persistAnal(); renderAnalysis(s); renderInspector(); });
    });
  }

  // The right-hand panel in analysis mode: every number at the chosen level, path vs none.
  function analysisInspector(box, s) {
    const A = analOf(s), L = A.level;
    const m = metrics(s, L, cleanPath(s, A.path)), o = metrics(s, L, []);
    const rows = [];
    const add = (label, a, b, unit = "", d = 1) => { if (a === b && !a) return; rows.push(`<tr${a !== b ? ' class="diff"' : ""}><th>${esc(label)}</th><td class="num">${fmt(a, d)}${unit}</td><td class="num">${fmt(b, d)}${unit}</td></tr>`); };
    const pct = (label, key) => { const a = f(m.E, key); if (a) rows.push(`<tr class="diff"><th>${esc(label)}</th><td class="num">+${fmt(a * 100)}%</td><td class="num">—</td></tr>`); };
    const times = (label, key) => { const a = f(m.E, key); if (a !== 1) rows.push(`<tr class="diff"><th>${esc(label)}</th><td class="num">×${fmt(a, 2)}</td><td class="num">×1</td></tr>`); };
    const plus = (label, key) => { const a = f(m.E, key); if (a) rows.push(`<tr class="diff"><th>${esc(label)}</th><td class="num">+${fmt(a, 1)}</td><td class="num">—</td></tr>`); };
    if (s.damage > 0) { add("Daño por golpe", m.dmg, o.dmg); if (m.burst) rows.push(`<tr class="diff"><th>Explosión al impactar</th><td class="num">${fmt(m.share * 100)}% del golpe</td><td class="num">—</td></tr>`); add("Golpes por uso", m.hits, o.hits); add("DPS estimado", m.dps, o.dps); }
    add("Maná", m.mana, o.mana); add("Maná por segundo", m.mps, o.mps, "/s"); add("Cooldown", m.cd, o.cd, " s", 2); add("Tiempo de uso", m.ut, o.ut, " s", 2);
    if (m.isAura) { add("Pasivo (% del base)", m.passive, o.passive, "%"); add("Activo (% del base)", m.active, o.active, "%"); }
    times("Área", "area"); times("Duración", "duration"); times("Alcance", "range"); times("Velocidad del proyectil", "projectileSpeed"); times("Distancia del proyectil", "projectileRange");
    times("Daño de la quemadura", "igniteDamage"); times("Drenaje de vida", "drain");
    pct("Prob. de quemar", "ignite"); pct("Prob. de electrocutar", "shock"); pct("Prob. de congelar", "freeze"); pct("Prob. de sangrado", "bleed");
    pct("Convertido a frío", "coldShare"); pct("Explosión al matar (del golpe)", "killBlast"); pct("Curación del activo (vida)", "heal"); pct("Ralentización del aceite", "oilSlow"); pct("Salpicadura de la detonación", "splash"); pct("Cargas que se quedan", "stacksKept"); pct("Potencia", "potency");
    plus("Atraviesa", "pierce"); plus("Encadena", "chains"); plus("Se divide", "forks"); plus("Rebota", "bounces"); plus("Réplicas", "aftershocks"); plus("Tótems extra", "totems"); plus("Empuje", "knockback"); plus("Invulnerabilidad (s)", "invulnerable"); plus("Cargas extra", "charges"); plus("Ventana para volver (s)", "rewind");
    if (m.E.converts) rows.push(`<tr class="diff"><th>Convierte el daño a</th><td>${esc(m.E.converts)}</td><td>—</td></tr>`);
    const spent = Object.entries(m.ranks).map(([id, k]) => { const n = liveNode(s, id); return n ? `<li><b>${esc(n.name)}</b> ${k}/${n.ranks.length}<br><span class="meta">${esc(n.ranks[k - 1])}</span></li>` : ""; }).join("");
    box.innerHTML = `<h2>Al nivel ${L}</h2>
      <table class="an-table"><thead><tr><th></th><th>Tu camino</th><th>Sin árbol</th></tr></thead><tbody>${rows.join("")}</tbody></table>
      ${m.blind.length ? `<p class="an-blind">Sin números (no entran en las cuentas, mira su texto): ${m.blind.map(esc).join(", ")}.</p>` : ""}
      <h2 style="margin-top:14px">Puntos gastados (${L - 1 < A.path.length ? L - 1 : A.path.length} de ${L - 1})</h2>
      ${spent ? `<ul class="links-list an-spent">${spent}</ul>` : `<p class="empty">Ninguno todavía: añade nodos con + en tu camino.</p>`}`;
  }

  function tabs() {
    return `<span class="tabs" role="tablist" aria-label="Vista"><button type="button" role="tab" data-mode="tree" aria-selected="${mode === "tree"}">Árbol</button><button type="button" role="tab" data-mode="analysis" aria-selected="${mode === "analysis"}">Análisis</button></span>`;
  }
  function bindTabs() {
    $("bench").querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
      mode = b.dataset.mode; try { localStorage.setItem(ANAL_KEY + "-mode", mode); } catch (e) { /* ignore */ }
      sel = null; renderBench(); renderInspector();
    }));
  }

  // --- the inspector ------------------------------------------------------------------
  function renderInspector() {
    const box = $("inspector");
    const s = skill(current);
    if (s && mode === "analysis") return analysisInspector(box, s);
    if (!s || !sel) {
      box.innerHTML = `<h2>Selección</h2><p class="empty">Pulsa un nodo o una flecha para editarlos. Para unir dos nodos, arrastra desde el punto derecho de uno hasta el otro.</p>`;
      return;
    }
    if (sel.type === "edge") return edgeInspector(box, s);
    const n = s.nodes.find(x => x.id === sel.id);
    if (!n) { sel = null; return renderInspector(); }
    const st = nodeStatus(s.id, n);
    const label = { new: "nuevo", changed: "cambio", removed: "quitar" }[st] || "";
    const ins = s.edges.filter(e => e.to === n.id && !e.removed), outs = s.edges.filter(e => e.from === n.id && !e.removed);
    const name = id => esc((s.nodes.find(x => x.id === id) || {}).name || id);
    box.innerHTML = `<h2>Nodo ${label ? `<span class="chip ${st}">${label}</span>` : ""}</h2>
      <div class="fields">
        <label class="wide">Nombre<input id="n-name" value="${esc(n.name)}"></label>
        <label>Tipo<select id="n-kind"><option value="Lesser">Menor</option><option value="Notable">Notable</option><option value="Special">Especial</option></select></label>
        <label>Grupo «elige uno»<input id="n-exclusive" value="${esc(n.exclusive)}" placeholder="vacío = no"></label>
      </div>
      <label>Qué hace cada rango</label>
      <div class="ranks">${n.ranks.map((r, i) => `<div class="rank-row"><span class="r">${i + 1}</span><input data-rank="${i}" value="${esc(r)}" aria-label="Rango ${i + 1}"><button type="button" data-del="${i}" aria-label="Quitar rango ${i + 1}" ${n.ranks.length < 2 ? "disabled" : ""}>×</button></div>`).join("")}</div>
      <div class="row"><button id="n-addrank" type="button">+ Rango</button></div>
      <label style="margin-top:10px">Se llega desde ${ins.length ? "(vale cualquiera)" : ""}</label>
      <ul class="links-list">${ins.length ? ins.map(e => `<li><span>${name(e.from)}</span><span class="num">≥ ${e.ranks} pt</span></li>`).join("") : `<li><span class="chip root">nodo de inicio</span></li>`}</ul>
      <label style="margin-top:10px">Abre</label>
      <ul class="links-list">${outs.length ? outs.map(e => `<li><span>${name(e.to)}</span><span class="num">≥ ${e.ranks} pt aquí</span></li>`).join("") : `<li class="empty">nada todavía</li>`}</ul>
      <label style="margin-top:10px">Notas para Claude<textarea id="n-note" placeholder="Idea, valores, por qué">${esc(n.note || "")}</textarea></label>
      <p style="font:11px var(--mono);color:var(--muted)">id: ${esc(n.id)}</p>
      <div class="row">${n.removed ? `<button id="n-restore" type="button">Recuperar nodo</button>` : `<button id="n-delete" class="danger" type="button">Quitar nodo</button>`}</div>`;
    $("n-kind").value = n.kind;
    const set = (k, v) => { n[k] = v; touch(); drawNodes(s); renderInspector(); };
    $("n-name").addEventListener("change", e => {
      n.name = e.target.value;
      if (!baseNode(s.id, n.id) && n.id.startsWith("new_node")) {
        let id = slug(n.name);
        while (s.nodes.some(x => x !== n && x.id === id)) id += "_2";
        s.edges.forEach(x => { if (x.from === n.id) x.from = id; if (x.to === n.id) x.to = id; });
        n.id = id; sel = { type: "node", id };
      }
      touch(); drawNodes(s); renderInspector();
    });
    $("n-kind").addEventListener("change", e => set("kind", e.target.value));
    $("n-exclusive").addEventListener("change", e => set("exclusive", e.target.value.trim()));
    $("n-note").addEventListener("change", e => { n.note = e.target.value; touch(); });
    box.querySelectorAll("input[data-rank]").forEach(el => el.addEventListener("change", e => { n.ranks[Number(e.target.dataset.rank)] = e.target.value; touch(); drawNodes(s); }));
    box.querySelectorAll("button[data-del]").forEach(el => el.addEventListener("click", e => { n.ranks.splice(Number(e.currentTarget.dataset.del), 1); set("ranks", n.ranks); }));
    $("n-addrank").addEventListener("click", () => { n.ranks.push(""); set("ranks", n.ranks); });
    if ($("n-delete")) $("n-delete").addEventListener("click", () => removeSelected(s));
    if ($("n-restore")) $("n-restore").addEventListener("click", () => { delete n.removed; touch(); drawNodes(s); renderInspector(); });
  }

  function edgeInspector(box, s) {
    const e = s.edges.find(x => x.from === sel.from && x.to === sel.to);
    if (!e) { sel = null; return renderInspector(); }
    const from = s.nodes.find(n => n.id === e.from), to = s.nodes.find(n => n.id === e.to);
    const st = edgeStatus(s.id, e);
    const label = { new: "nueva", changed: "cambio", removed: "quitar" }[st] || "";
    box.innerHTML = `<h2>Flecha ${label ? `<span class="chip ${st}">${label}</span>` : ""}</h2>
      <p><strong>${esc(from ? from.name : e.from)}</strong> → <strong>${esc(to ? to.name : e.to)}</strong></p>
      <div class="fields">
        <label class="wide">Condición: puntos que hay que tener en «${esc(from ? from.name : e.from)}»<input id="e-ranks" class="num" type="number" min="1" max="10" value="${e.ranks}"></label>
        <label class="wide">Nota (otra condición, idea…)<textarea id="e-note" placeholder="p. ej. «solo si no tienes X»">${esc(e.note || "")}</textarea></label>
      </div>
      <p class="empty">Si a «${esc(to ? to.name : e.to)}» llegan varias flechas, basta con cumplir una.</p>
      <div class="row">${e.removed ? `<button id="e-restore" type="button">Recuperar flecha</button>` : `<button id="e-delete" class="danger" type="button">Quitar flecha</button>`}</div>`;
    $("e-ranks").addEventListener("change", ev => { e.ranks = Math.max(1, Number(ev.target.value) || 1); touch(); drawEdges(s); renderInspector(); });
    $("e-note").addEventListener("change", ev => { e.note = ev.target.value; touch(); });
    if ($("e-delete")) $("e-delete").addEventListener("click", () => removeSelected(s));
    if ($("e-restore")) $("e-restore").addEventListener("click", () => { delete e.removed; touch(); drawNodes(s); renderInspector(); });
  }

  // --- the change list ----------------------------------------------------------------
  function changeLines() {
    const out = [];
    for (const s of state.skills) {
      const b = baseSkill(s.id);
      const nm = id => (s.nodes.find(n => n.id === id) || (b && b.nodes.find(n => n.id === id)) || {}).name || id;
      if (!b) out.push(`NUEVA HABILIDAD ${s.name} (${s.id}): ${s.type}, nv ${s.unlock}, daño ${s.damage}, uso ${s.useTime}s, cd ${s.cooldown}s, maná ${s.mana}. ${s.description}${s.note ? " — Nota: " + s.note : ""}`);
      else {
        for (const k of ["name", "unlock", "damage", "useTime", "cooldown", "mana", "description"]) if ((b[k] ?? "") !== (s[k] ?? "")) out.push(`${s.name}: ${k} ${JSON.stringify(b[k])} → ${JSON.stringify(s[k])}`);
        if (s.note && s.note !== (b.note || "")) out.push(`${s.name}: nota — ${s.note}`);
      }
      for (const n of s.nodes) {
        const st = nodeStatus(s.id, n);
        const where = `${s.name} / ${n.name}`;
        if (st === "new") out.push(`${where}: NODO NUEVO (${kindLabel(n.kind)}${n.exclusive ? `, elige-uno "${n.exclusive}"` : ""}): ${n.ranks.join(" | ")}${n.note ? " — Nota: " + n.note : ""}`);
        else if (st === "removed") out.push(`${where}: QUITAR NODO (${n.id})${n.note ? " — Nota: " + n.note : ""}`);
        else if (st === "changed") {
          const o = baseNode(s.id, n.id), diffs = [];
          for (const k of ["name", "kind", "exclusive"]) if ((o[k] ?? "") !== (n[k] ?? "")) diffs.push(`${k} ${JSON.stringify(o[k])} → ${JSON.stringify(n[k])}`);
          if (JSON.stringify(o.ranks) !== JSON.stringify(n.ranks)) diffs.push(`rangos ${o.ranks.join(" | ")} → ${n.ranks.join(" | ")}`);
          if (n.note && n.note !== (o.note || "")) diffs.push(`nota — ${n.note}`);
          out.push(`${where} (${n.id}): ${diffs.join("; ")}`);
        }
      }
      for (const e of s.edges) {
        const st = edgeStatus(s.id, e);
        const what = `${s.name}: flecha ${nm(e.from)} → ${nm(e.to)}`;
        if (st === "new") out.push(`${what}: NUEVA, necesita ${e.ranks} pt en ${nm(e.from)}${e.note ? " — Nota: " + e.note : ""}`);
        else if (st === "removed") out.push(`${what}: QUITAR`);
        else if (st === "changed") { const o = baseEdge(s.id, e); out.push(`${what}: ${o.ranks !== e.ranks ? `${o.ranks} → ${e.ranks} pt` : ""}${e.note ? " — Nota: " + e.note : ""}`); }
      }
      if (b) for (const n of b.nodes) if (!s.nodes.find(x => x.id === n.id)) out.push(`${s.name} / ${n.name}: QUITAR NODO (${n.id})`);
    }
    return out;
  }
  function renderChanges() {
    const lines = changeLines();
    $("changes").innerHTML = `<h2>Cambios respecto al juego</h2>
      <label>Nota general<textarea id="g-note" placeholder="Cualquier cosa que quieras decirme sobre esta tanda de cambios">${esc(state.note)}</textarea></label>
      ${lines.length ? `<ol>${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ol>` : `<p class="none">Aún no hay cambios. Lo que edites aparecerá aquí, listo para copiar. (Mover nodos solo cambia la vista; no cuenta como cambio.)</p>`}`;
    $("g-note").addEventListener("change", e => { state.note = e.target.value; touch(); });
  }

  // --- saving -----------------------------------------------------------------------
  const RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  function payload(savedAt) { return { format: 2, version: DATA_VERSION, savedAt, note: state.note, base: state.base, edited: state.skills, skills: state.skills }; }
  function documentFor(data) {
    const json = JSON.stringify(data).replace(/</g, "\\u003c");
    const style = document.getElementById("page-style").outerHTML;
    const app = document.getElementById("app-src").textContent;
    const head = Array.from(document.querySelectorAll("title, meta[name='claude:viewport-fit-sides'], link[href*='fonts']")).map(e => e.outerHTML).join("\n");
    const close = "</" + "script>";
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + RESET + "</style></head><body>"
      + head + "\n" + style + "\n<div id=\"root\"></div>\n<script type=\"application/json\" id=\"tree-data\">" + json + close
      + "\n<script id=\"app-src\">" + app + close + "\n</body></html>";
  }
  let artifact = null;
  if (window.claude && typeof window.claude.use === "function") window.claude.use("artifact").then(a => { artifact = a; }).catch(() => { artifact = null; });

  async function save() {
    const when = new Date().toISOString();
    if (artifact) {
      $("btn-save").disabled = true;
      setStatus("Guardando…");
      try {
        await artifact.publish(documentFor(payload(when)));
        try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
        setStatus("Guardado. Claude puede leer esta versión.");
      } catch (e) {
        const code = e && e.code;
        setStatus(code === "conflict" ? "Otra persona guardó a la vez; la página se recarga con su versión." : code === "not_granted" || code === "not_writer" ? "Solo lectura: exporta el JSON y pásaselo a Claude." : "No se pudo guardar: " + (e && e.message || e));
      } finally { $("btn-save").disabled = false; }
      return;
    }
    persist();
    setStatus("Guardado en este navegador. Para pasárselo a Claude: Exportar JSON y adjúntalo en el chat (o Copiar cambios).");
  }
  async function copyChanges() {
    const text = (state.note ? "Nota: " + state.note + "\n" : "") + changeLines().map((l, i) => `${i + 1}. ${l}`).join("\n");
    try { await navigator.clipboard.writeText(text || "Sin cambios"); setStatus("Cambios copiados: pégalos en el chat."); }
    catch (e) {
      $("changes").insertAdjacentHTML("beforeend", `<pre id="copy-fallback">${esc(text)}</pre>`);
      const r = document.createRange(); r.selectNodeContents($("copy-fallback")); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      setStatus("No pude copiar solo: el texto está seleccionado abajo, cópialo con Ctrl+C.");
    }
  }
  async function exportJson() {
    const text = JSON.stringify(payload(new Date().toISOString()), null, 2);
    if (window.claude && typeof window.claude.use === "function") {
      const downloads = await window.claude.use("downloads").catch(() => null);
      if (downloads) { try { await downloads.save({ filename: "skill-trees-edited.json", data: text }); setStatus("JSON exportado."); return; } catch (e) { /* fall through */ } }
    }
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      a.download = "skill-trees-edited.json"; a.click();
      setStatus("JSON exportado.");
    } catch (e) { setStatus("No se pudo exportar: usa Copiar cambios."); }
  }

  $("file-import").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      const list = d.edited || d.skills;
      if (!Array.isArray(list)) throw new Error("no trae 'skills'");
      state.skills = list.map(toGraph); state.note = d.note || state.note;
      current = state.skills[0] && state.skills[0].id; sel = null;
      touch(); renderAll(); setStatus("Importado " + f.name + ".");
    } catch (err) { setStatus("Ese archivo no es un JSON del banco de trabajo: " + err.message); }
  });
  $("btn-save").addEventListener("click", save);
  $("btn-copy").addEventListener("click", copyChanges);
  $("btn-export").addEventListener("click", exportJson);
  let resetArmed = false;
  $("btn-reset").addEventListener("click", e => {
    if (!resetArmed) { resetArmed = true; e.currentTarget.textContent = "¿Seguro? Pulsa otra vez"; setTimeout(() => { resetArmed = false; $("btn-reset").textContent = "Deshacer todo"; }, 4000); return; }
    state.skills = JSON.parse(JSON.stringify(state.base)); state.note = ""; sel = null; resetArmed = false;
    $("btn-reset").textContent = "Deshacer todo";
    try { localStorage.removeItem(STORE_KEY); } catch (err) { /* ignore */ }
    renderAll(); setStatus("Vuelto a lo que tiene el juego.");
  });
  $("btn-new-skill").addEventListener("click", () => {
    let id = "new_skill", i = 1;
    while (skill(id)) id = "new_skill_" + (++i);
    state.skills.push({ id, name: "Habilidad nueva", type: "?", tags: "", unlock: 1, damage: 0, useTime: 0.5, cooldown: 0, mana: 5, description: "", note: "", branches: [], nodes: [], edges: [] });
    current = id; sel = null; touch(); renderAll();
  });
  $("search").addEventListener("input", renderList);

  function renderAll() { renderList(); renderBench(); renderInspector(); renderChanges(); }
  renderAll();
  setStatus(staleDraft ? "Los datos del juego han cambiado desde tu último borrador en este navegador: se ha descartado y ves los valores actuales." : dirty ? "Tienes un borrador sin guardar de la última vez." : state.savedAt ? "Última versión guardada: " + new Date(state.savedAt).toLocaleString() : "Datos sacados del juego. Edita y guarda.");
})();
</script>
